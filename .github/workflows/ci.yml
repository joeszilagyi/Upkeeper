name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-validation:
    name: Local validation
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    # Start with Ubuntu. Add macos-latest only after its portability gate passes.
    # Temporary supported compatibility target, not an isolation bypass:
    # 24.04 rejects setup; 26.04 rejects required nested execution. Keep the
    # same fail-closed preflight and complete suite. Migrate before the first
    # 22.04 retirement brownout (2027-03-23); see docs/validation-evidence.md.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Push events can contain more than one commit; retain the event's
          # before revision so committed-diff validation never falls back to
          # an empty working-tree comparison.
          fetch-depth: 0
          persist-credentials: false

      - name: Probe CI dependencies
        shell: bash
        # Match the executor's tool path; host-only tools are not dependencies
        # available inside its namespace. Package preparation stays outside it.
        run: env PATH=/usr/bin:/bin tools/setup_ci_dependencies.sh

      - name: Probe unprivileged validation isolation
        shell: bash
        run: bash tools/probe_validation_isolation.sh

      - name: Determine committed diff range
        id: diff_range
        shell: bash
        run: |
          set -euo pipefail
          base_ref=""
          head_ref="${GITHUB_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="HEAD^1"
            head_ref="HEAD"
          else
            before_sha="${{ github.event.before }}"
            if [[ "$before_sha" != "0000000000000000000000000000000000000000" ]]; then
              base_ref="$before_sha"
            fi
          fi
          printf 'base=%s\n' "$base_ref" >>"$GITHUB_OUTPUT"
          printf 'head=%s\n' "$head_ref" >>"$GITHUB_OUTPUT"

      - name: Classify change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          scope_args=(--classify-only)

          if [[ -n "${{ steps.diff_range.outputs.base }}" ]]; then
            scope_args+=(--base "${{ steps.diff_range.outputs.base }}" --head "${{ steps.diff_range.outputs.head }}")
          fi

          if scope_output="$(tools/docs_only_fast_path.sh "${scope_args[@]}")"; then
            printf '%s\n' "$scope_output"
            printf '%s\n' "$scope_output" >>"$GITHUB_OUTPUT"
          else
            printf 'docs_only=0\n'
            printf 'low_risk=0\n'
            printf 'validation_gate=full\n'
            printf 'scope_known=0\n'
            printf 'docs_only=0\n' >>"$GITHUB_OUTPUT"
            printf 'low_risk=0\n' >>"$GITHUB_OUTPUT"
            printf 'validation_gate=full\n' >>"$GITHUB_OUTPUT"
            printf 'scope_known=0\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Report selected validation gate
        shell: bash
        run: |
          printf 'CI validation gate: %s\n' "${{ steps.scope.outputs.validation_gate }}"

      - name: Parallel local gates
        if: steps.scope.outputs.docs_only != '1'
        env:
          TMPDIR: ${{ runner.temp }}
          UPKEEPER_TEST_ATTESTATION_FILE: ${{ runner.temp }}/upkeeper-test-attestation.json
          UPKEEPER_VALIDATION_ATTESTATION_FILE: ${{ runner.temp }}/upkeeper-validation-attestation.json
          UPKEEPER_VALIDATION_DIFF_BASE: ${{ steps.diff_range.outputs.base }}
          UPKEEPER_VALIDATION_DIFF_HEAD: ${{ steps.diff_range.outputs.head }}
          UPKEEPER_VALIDATION_NO_REUSE: '1'
          UPKEEPER_VALIDATION_PHASE_SHOW_PASS_OUTPUT: '1'
          UPKEEPER_TEST_SHOW_PASS_OUTPUT: '1'
        run: tools/run_validation_phases.sh --phases shell_syntax,unit_tests,public_docs,diff_whitespace

      - name: Docs-only fast path
        if: steps.scope.outputs.docs_only == '1'
        shell: bash
        run: |
          set -euo pipefail
          scope_args=(--validate)
          if [[ -n "${{ steps.diff_range.outputs.base }}" ]]; then
            scope_args+=(--base "${{ steps.diff_range.outputs.base }}" --head "${{ steps.diff_range.outputs.head }}")
          fi
          tools/docs_only_fast_path.sh "${scope_args[@]}"

      - name: Full validation
        if: steps.scope.outputs.validation_gate == 'full'
        env:
          TMPDIR: ${{ runner.temp }}
          UPKEEPER_TEST_ATTESTATION_FILE: ${{ runner.temp }}/upkeeper-test-attestation.json
          UPKEEPER_VALIDATION_NO_REUSE: '1'
        run: tools/validate_upkeeper.sh --full --profile

      - name: Upload full-validation timings
        if: always() && steps.scope.outputs.validation_gate == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: validation-timing-${{ github.job }}
          # Only diagnostic timing rows, never private evidence custody keys.
          path: ${{ runner.temp }}/upkeeper-pinned-validation-*/output/runtime/validation-timing/*.jsonl
          if-no-files-found: ignore
